name: Port TWRP Vivo Y12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y android-sdk-platform-tools python3

    - name: Clone AIK & Port TWRP
      run: |
        git clone https://github.com/Carliv/Carliv-Image-Kitchen.git CIK
        cd CIK
        chmod +x *

    - name: Upload TWRP Recovery Image
      uses: actions/upload-artifact@v4
      with:
        name: recovery.img
        path: CIK/output/recovery.img
