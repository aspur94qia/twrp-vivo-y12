name: Port TWRP Vivo Y12 MT6765

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 cpio android-sdk-platform-tools curl wget

    - name: Download Magiskboot
      run: |
        wget https://github.com/morfik/termux-twrp-builder/raw/master/tools/magiskboot -O magiskboot
        chmod +x magiskboot

    - name: Download Donor TWRP MT6765
      run: |
        mkdir -p donor
        curl -sL "https://raw.githubusercontent.com/minimal-manifest-twrp/platform_manifest_twrp_omni/twrp-9.0/twrp.img" -o donor/donor.img || true

    - name: Unpack Stock & Donor
      run: |
        mkdir -p stock_extracted donor_extracted
        
        # Unpack Stock Vivo Y12
        cd stock_extracted
        ../magiskboot unpack ../stock_recovery.img
        cd ..

        # Unpack Donor MT6765
        cd donor_extracted
        ../magiskboot unpack ../donor/donor.img
        cd ..

    - name: Swap Kernel & Repack TWRP
      run: |
        mkdir -p output_work
        # Ambil ramdisk dari donor TWRP
        cp donor_extracted/ramdisk.cpio output_work/
        
        # Swap Kernel (zImage/kernel) & DTB dari Stock Vivo Y12
        cp stock_extracted/kernel output_work/ 2>/dev/null || cp donor_extracted/kernel output_work/
        cp stock_extracted/dtb output_work/ 2>/dev/null || true

        # Repack jadi TWRP Vivo Y12
        cd output_work
        ../magiskboot repack ramdisk.cpio twrp_vivo_y12.img
        mkdir -p ../output
        mv new-boot.img ../output/twrp_vivo_y12.img 2>/dev/null || mv twrp_vivo_y12.img ../output/twrp_vivo_y12.img

    - name: Upload TWRP Result
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_Vivo_Y12_MT6765
        path: output/twrp_vivo_y12.img
