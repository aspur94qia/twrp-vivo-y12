name: Port TWRP Vivo Y12 MT6765

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 cpio android-sdk-platform-tools curl wget unzip

    - name: Setup Magiskboot
      run: |
        wget -q https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O magisk.zip
        unzip -j magisk.zip "lib/x86_64/libmagiskboot.so" -d .
        mv libmagiskboot.so magiskboot
        chmod +x magiskboot

    - name: Download & Verify Donor TWRP
      run: |
        mkdir -p donor
        
        # Download dari GitHub Release Direct Asset
        wget -q -O donor/donor.img "https://github.com/aosp-realm/releases/download/v1.0/twrp_mt6765_pie.img" || \
        curl -sL "https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni/releases/download/twrp-9.0/twrp-9.0-mt6765.img" -o donor/donor.img

        # Cek apakah file benar-benar image (bukan HTML) dan ukuran > 10MB
        SIZE=$(stat -c%s "donor/donor.img" 2>/dev/null || echo 0)
        echo "Ukuran file donor: $SIZE bytes"
        
        if [ "$SIZE" -lt 10000000 ]; then
          echo "File corrupt/HTML, mengunduh dari mirror cadangan..."
          curl -sL "https://archive.org/download/twrp_mt6765_pie/twrp.img" -o donor/donor.img
        fi

    - name: Unpack Stock & Donor
      run: |
        mkdir -p stock_extracted donor_extracted
        
        # Unpack Stock Vivo Y12
        cd stock_extracted
        ../magiskboot unpack ../stock_recovery.img
        cd ..

        # Unpack Donor MT6765
        cd donor_extracted
        ../magiskboot unpack ../donor/donor.img
        cd ..

    - name: Swap Kernel & Repack TWRP
      run: |
        mkdir -p output_work
        # Salin ramdisk TWRP
        cp donor_extracted/ramdisk.cpio output_work/
        
        # Salin Kernel & DTB dari Stock Vivo Y12
        cp stock_extracted/kernel output_work/ 2>/dev/null || true
        cp stock_extracted/dtb output_work/ 2>/dev/null || true
        cp stock_extracted/kernel_dtb output_work/ 2>/dev/null || true

        # Repack
        cd output_work
        ../magiskboot repack ramdisk.cpio twrp_vivo_y12.img
        mkdir -p ../output
        mv new-boot.img ../output/twrp_vivo_y12.img 2>/dev/null || mv twrp_vivo_y12.img ../output/twrp_vivo_y12.img

    - name: Upload TWRP Result
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_Vivo_Y12_MT6765
        path: output/twrp_vivo_y12.img
