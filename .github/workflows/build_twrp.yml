name: Port TWRP Vivo Y12 MT6765

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Install Dependencies AIK
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3 cpio android-sdk-platform-tools curl lib32z1 lib32ncurses6 file

    - name: Setup Android Image Kitchen
      run: |
        git clone https://github.com/osm0sis/Android-Image-Kitchen.git AIK
        cd AIK
        chmod -R +x .

    - name: Download Donor TWRP MT6765
      run: |
        mkdir -p AIK/donor
        curl -sL "https://raw.githubusercontent.com/minimal-manifest-twrp/platform_manifest_twrp_omni/twrp-9.0/twrp.img" -o AIK/donor/donor.img || true

    - name: Unpack Stock & Donor
      run: |
        cd AIK
        bash unpackimg.sh --nosudo ../stock_recovery.img
        mv split_img stock_split
        mv ramdisk stock_ramdisk

        bash unpackimg.sh --nosudo donor/donor.img
        mv split_img donor_split
        mv ramdisk donor_ramdisk

    - name: Swap Kernel & Repack TWRP
      run: |
        cd AIK
        mkdir -p split_img ramdisk
        cp -r donor_ramdisk/* ramdisk/
        cp -r donor_split/* split_img/

        # Timpa zImage & DTB bawaan donor pakai punya Stock Vivo Y12
        cp -f stock_split/*zImage split_img/ 2>/dev/null || true
        cp -f stock_split/*dtb split_img/ 2>/dev/null || true

        # Repack
        bash repackimg.sh --nosudo
        mkdir -p ../output
        mv image-new.img ../output/twrp_vivo_y12.img

    - name: Upload TWRP Result
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_Vivo_Y12_MT6765
        path: output/twrp_vivo_y12.img
